<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #111827; }
.title { font-size: 24px; font-weight: 700; }
.axis { font-size: 13px; fill: #6b7280; }
.label { font-size: 13px; }
.small { font-size: 12px; fill: #6b7280; }
.value { font-size: 12px; font-weight: 600; }
</style>
<text class="title" x="560.0" y="38" text-anchor="middle">Case Study: Candidate Budget Reveals a Correct Expression</text>
<defs><marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
<rect x="54" y="70" width="1012" height="430" rx="18" fill="#f8fafc" stroke="#93c5fd" stroke-width="2" stroke-dasharray="8 8"/>
<path d="M54 70 H490 L445 118 H54 Z" fill="#bfdbfe"/>
<text x="76" y="103" font-size="20" font-weight="700">Verifier-based best-of-N selection</text>
<rect x="90" y="150" width="210" height="230" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text class="label" x="195" y="188" text-anchor="middle" font-weight="700">Problem</text>
<text class="small" x="195" y="226" text-anchor="middle">numbers = [2, 3, 6, 10]</text>
<text class="small" x="195" y="254" text-anchor="middle">target = 24</text>
<text class="small" x="195" y="304" text-anchor="middle">Verifier checks:</text>
<text class="small" x="195" y="330" text-anchor="middle">AST + numbers + target</text>
<rect x="380" y="145" width="450" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text class="label" x="605" y="181" text-anchor="middle" font-weight="700">Candidate outputs from the same model</text>
<rect x="404" y="213" width="402" height="42" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.3"/>
<text class="small" x="424" y="239" font-weight="700">Greedy</text>
<text class="small" x="522" y="239" font-family="Menlo, monospace">(10-((2-3)*6))</text>
<text x="724" y="240" font-size="18" fill="#ef4444" font-weight="700">×</text>
<text class="small" x="746" y="239" fill="#ef4444">wrong_value</text>
<rect x="404" y="271" width="402" height="42" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.3"/>
<text class="small" x="424" y="297" font-weight="700">Best-of-8</text>
<text class="small" x="522" y="297" font-family="Menlo, monospace">((6-(2-3))*10)</text>
<text x="724" y="298" font-size="18" fill="#ef4444" font-weight="700">×</text>
<text class="small" x="746" y="297" fill="#ef4444">wrong_value</text>
<rect x="404" y="329" width="402" height="42" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.3"/>
<text class="small" x="424" y="355" font-weight="700">Best-of-16</text>
<text class="small" x="522" y="355" font-family="Menlo, monospace">(10-3*2)*6</text>
<text x="724" y="356" font-size="18" fill="#16a34a" font-weight="700">✓</text>
<text class="small" x="746" y="355" fill="#16a34a">correct</text>
<line x1="312" y1="265" x2="360" y2="265" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow2)"/>
<line x1="842" y1="265" x2="890" y2="265" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow2)"/>
<rect x="905" y="170" width="130" height="170" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
<text class="label" x="970" y="214" text-anchor="middle" font-weight="700">Selected</text>
<text x="970" y="260" text-anchor="middle" font-size="38" fill="#16a34a" font-weight="700">✓</text>
<text class="small" x="970" y="296" text-anchor="middle">best-of-16</text>
<text class="small" x="970" y="320" text-anchor="middle">passes verifier</text>
<rect x="245" y="420" width="630" height="48" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
<text class="label" x="560" y="450" text-anchor="middle">Increasing candidate budget exposes a valid expression; the symbolic verifier extracts it from the sampled pool.</text>
</svg>
